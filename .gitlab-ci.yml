      - trivy-frontend-scan.txt
    expire_in: 30 days

# ==========================================
# STAGE: SECURITY - SCAN DES SECRETS EXPOSÉS

# Job 5 : Scanner les secrets exposés (TruffleHog)
# ==========================================

# Détecte les clés API, tokens, mots de passe en clair dans le code

security:secrets-scan:
  stage: security
  
  # TRUFFLEHOG : outil spécialisé détection de secrets dans le code
  image: trufflesecurity/trufflehog:latest
  
  variables:
    SCAN_TYPE: "Exposed Secrets"
  
  before_script:
    - echo "SCAN SECRETS - TruffleHog"
    - echo "Type  $SCAN_TYPE"
  
  script:
    - echo "Scan des secrets exposés..."
    
    # Scanner tout le repo Git
    # --only-verified : seulement les secrets vérifiés (moins de faux positifs)
    # --fail : exit code 1 si secrets trouvés
    # --json : format JSON pour parsing

    - trufflehog git file://. 
        --only-verified 
        --json > secrets-report.json || true
    
    # Vérifier si des secrets ont été trouvés
    - |
      if [ -s secrets-report.json ]; then
        echo "❌ SECRETS DÉTECTÉS ! ❌"
        echo "Les secrets suivants ont été trouvés dans le code :"
        cat secrets-report.json | head -100
        echo "ACTION REQUISE :"
        echo "1. Supprimer les secrets du code"
        echo "2. Utiliser des variables d'environnement (.env)"
        echo "3. Ne JAMAIS commiter de secrets"
        exit 1
      else
        echo "Aucun secret exposé détecté"
      fi
  
  after_script:
    - echo " Rapport sauvegardé  secrets-report.json"
  
  # CRITIQUE : Bloque le pipeline si secrets trouvés
  allow_failure: false
  
  only:
    - main
    - dev
    - merge_requests
  
  artifacts:
    name: "secrets-scan-$CI_COMMIT_SHORT_SHA"
    when: always
    paths:
      - secrets-report.json
    expire_in: 30 days

