stages:
  - install
  - test
  - security

variables:
  NODE_ENV: test
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/portfy_test"

# ==========================================
# POSTGRES SERVICE
# ==========================================

default:
  image: node:22

services:
  - postgres:16

before_script:
  - node -v
  - npm -v

# ==========================================
# FRONTEND
# ==========================================

frontend-build:
  stage: install

  script:
    - cd frontend
    - npm install
    - npm run build

  only:
    - dev
    - main
    - merge_requests

frontend-lint:
  stage: test

  script:
    - cd frontend
    - npm install
    - npm run lint

  only:
    - dev
    - main
    - merge_requests

# ==========================================
# BACKEND
# ==========================================

backend-test:
  stage: test

  variables:
  NODE_ENV: test
  
  script:
    - cd backend
    - npm install
    - npx prisma generate
    - npx prisma migrate deploy
    - npm test

  only:
    - dev
    - main
    - merge_requests

# ==========================================
# TRIVY BACKEND
# ==========================================

trivy-backend:
  stage: security

  image:
    name: aquasec/trivy:latest
    entrypoint: [""]

  script:
    - trivy fs --severity HIGH,CRITICAL backend/

  allow_failure: true

  only:
    - dev
    - main
    - merge_requests

# ==========================================
# TRIVY FRONTEND
# ==========================================

trivy-frontend:
  stage: security

  image:
    name: aquasec/trivy:latest
    entrypoint: [""]

  script:
    - trivy fs --severity HIGH,CRITICAL frontend/

  allow_failure: true

  only:
    - dev
    - main
    - merge_requests

# ==========================================
# TRUFFLEHOG SECRET SCAN
# ==========================================

secret-scan:
  stage: security

  image: trufflesecurity/trufflehog:latest

  script:
    - trufflehog filesystem . || true

  allow_failure: true

  only:
    - dev
    - main
    - merge_requests

