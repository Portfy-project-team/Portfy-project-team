    - echo "Path  $SCAN_PATH"
    - echo "Sévérité $TRIVY_SEVERITY"
  
  script:
    # Vérifier que le dossier existe
    - |
      if [ ! -d "$SCAN_PATH" ]; then
        echo " ERREUR: Dossier $SCAN_PATH introuvable"
        exit 1
      fi
    
    # Vérifier que package-lock.json existe
    - |
      if [ ! -f "$SCAN_PATH/package-lock.json" ]; then
        echo "WARNING: package-lock.json introuvable"
        echo "Exécuter 'npm install' pour le générer"
        echo "Skip scan"
        exit 0
      fi
    
    # Scanner le code frontend
    - echo "Scan du code frontend..."
    - |
