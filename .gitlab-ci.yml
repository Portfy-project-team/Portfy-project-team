stages:
  - install
  - test
  - security

variables:
  NODE_ENV: test
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/portfy_test"
  TRIVY_SEVERITY: "CRITICAL,HIGH" #7-8.9->HIGH / 9-10->CRITICAL
  TRIVY_EXIT_CODE: "1"
  TRIVY_CACHE_DIR: ".trivycache/" #cache de trivy
  TRIVY_FORMAT: "table" #sortie sous forme de table
  TRIVY_TIMEOUT: "10m"


cache:
  key: "${CI_COMMIT_REF_SLUG}-trivy"  # Cache par branche
  paths:
    - .trivycache/
  policy: pull-push  # Lire et écrire dans le cache

# ==========================================
# POSTGRES SERVICE
# ==========================================

default:
  image: node:22

services:
  - postgres:16

before_script:
  - node -v
  - npm -v

# ==========================================
# FRONTEND
# ==========================================

frontend-build:
  stage: install

  script:
    - cd frontend
    - npm install
    - npm run build

  only:
    - dev
    - main
    - merge_requests

frontend-lint:
  stage: test

  script:
    - cd frontend
    - npm install
    - npm run lint

  only:
    - dev
    - main
    - merge_requests

# ==========================================
# BACKEND
# ==========================================

backend-test:
  stage: test

  variables:
    NODE_ENV: test
  
  script:
    - cd backend
    - npm install
    - npx prisma generate
    - npx prisma migrate deploy
    - npm test

  only:
    - dev
    - main
    - merge_requests

# ==========================================
# Job 1 : Scanner PostgreSQL 16.8-alpine
# ==========================================

# Scanne l'image officielle PostgreSQL depuis Docker Hub
# Vérifie les vulnérabilités dans les paquets Alpine Linux

security:trivy-postgres:
  stage: security
  
  image: aquasec/trivy:latest
  
  variables:
    IMAGE_NAME: "postgres:16.8-alpine"
    SCAN_TYPE: "Docker Hub Image"
  
  before_script:
    - echo " SCAN TRIVY - PostgreSQL"
    - echo "Type  $SCAN_TYPE"
    - echo "Image  $IMAGE_NAME"
    - echo "Sévérité  $TRIVY_SEVERITY"
  
  script:
    - echo "Mise à jour de la base de données CVE..."
    - trivy image --download-db-only
    - echo " Scan en cours..."
    - |
      trivy image \
        --severity $TRIVY_SEVERITY \
        --exit-code $TRIVY_EXIT_CODE \
        --format $TRIVY_FORMAT \
        --timeout $TRIVY_TIMEOUT \
        --output trivy-postgres-scan.txt \
        $IMAGE_NAME
    
      - echo " PostgreSQL $IMAGE_NAME : Aucune vulnérabilité CRITICAL/HIGH" 
  after_script:
     - echo "Rapport sauvegardé trivy-postgres-scan.txt"
  
  allow_failure: false #en cas de vulnerabilites la pipeline est bloque
  
  # Exécuter sur ces branches/événements
  only:
    - main
    - dev
    - merge_requests
  
  # Sauvegarder le rapport même en cas d'échec
  artifacts:
    name: "trivy-postgres-scan-$CI_COMMIT_SHORT_SHA"
    when: always
    paths:
      - trivy-postgres-scan.txt
    expire_in: 30 days
  #  reports:
  #   junit: trivy-postgres-scan.txt

# ==========================================
# Job 2 : Scanner le code BACKEND (dépendances npm)
# ==========================================

# Scanne package-lock.json pour détecter les dépendances vulnérables

security:trivy-backend:
  stage: security
  image: aquasec/trivy:latest
  
  variables:
    SCAN_PATH: "backend/"
    SCAN_TYPE: "Backend Code (npm)"
  
  before_script:
  - "echo SCAN_TRIVY_POSTGRESQL"
  - "echo $SCAN_TYPE"
  - "echo $IMAGE_NAME"
  - "echo $TRIVY_SEVERITY"
  
  script:
    # Vérifier que le dossier existe
    - |
      if [ ! -d "$SCAN_PATH" ]; then
        echo " ERREUR: Dossier $SCAN_PATH introuvable"
        exit 1
      fi
    
    # Vérifier que package-lock.json existe
    - |
      if [ ! -f "$SCAN_PATH/package-lock.json" ]; then
        echo "WARNING: package-lock.json introuvable"
        echo "Exécuter 'npm install' pour le générer"
        echo "Skip scan"
        exit 0
      fi
    
    # Scanner le code backend
    - echo "Scan du code backend..."
    - |
        trivy fs \
          --severity $TRIVY_SEVERITY \
          --exit-code $TRIVY_EXIT_CODE \
          --format $TRIVY_FORMAT \
          --timeout $TRIVY_TIMEOUT \
          --output trivy-backend-scan.txt \
          $SCAN_PATH
    
    # Afficher le résultat
    - cat trivy-backend-scan.txt
    - echo "Backend  Aucune vulnérabilité CRITICAL/HIGH"
  
  after_script:
    - echo "Rapport sauvegardé trivy-backend-scan.txt"
  
  allow_failure: false
  
  only:
    - main
    - dev
    - merge_requests
  
  artifacts:
    name: "trivy-backend-scan-$CI_COMMIT_SHORT_SHA"
    when: always
    paths:
      - trivy-backend-scan.txt
    expire_in: 30 days

