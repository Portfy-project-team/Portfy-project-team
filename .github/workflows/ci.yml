name: CI Pipeline

on:
  push:
    branches: [dev, main,feature/test-backend]
  pull_request:
    branches: [dev, main,feature/test-backend]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install frontend
        run: |
          cd frontend
          npm install

      - name: Build frontend
        run: |
          cd frontend
          chmod +x node_modules/.bin/vite
          npm run build 

      - name: Install backend
        run: |
          cd backend
          npm install
      
      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      - name: Run backend tests
        run: |
          cd backend
          npm test