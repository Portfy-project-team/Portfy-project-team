name: CI Pipeline

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
      JWT_ACCESS_SECRET: testsecret
      JWT_REFRESH_SECRET: refreshsecret
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      NODE_ENV: test

    steps:
      # ==========================================
      # Récupération du dépôt GitHub
      # ==========================================

      - name: Checkout code
        uses: actions/checkout@v4


      # ==========================================
      # Installation de Node.js
      # Cache npm pour accélérer le pipeline
      # ==========================================

      - name: Setup Node
        uses: actions/setup-node@v4
        with:

          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # ==========================================
      # FRONTEND
      # ==========================================

      # Installation des dépendances frontend


      - name: Install frontend
        run: |
          cd frontend
          npm install


      # Vérification qualité du code frontend

      - name: Run frontend lint
        run: |
          cd frontend
          npm run lint


      # Construction du projet frontend
      # Vérifie que Vite compile correctement

      - name: Build frontend
        run: |
          cd frontend
          chmod +x node_modules/.bin/vite
          npm run build


      # Tests frontend

      #- name: Run frontend tests
      #  run: |
      #    cd frontend
      #    npm test -- --run


      # Audit sécurité frontend
      # Vérifie les vulnérabilités npm

      #- name: Security audit frontend
      #  run: |
      #    cd frontend
      #    npm audit --audit-level=high


      # ==========================================
      # BACKEND
      # ==========================================

      # Installation dépendances backend

      - name: Install backend
        run: |
          cd backend
          npm install

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfy_test

      - name: Run Prisma Migrations
        run: |
          cd backend
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfy_test
          

       #Tests backend
       # À activer après stabilisation des tests

      - name: Run backend tests
        run: |
          cd backend
          npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfy_test
          JWT_ACCESS_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          NODE_ENV: test
          SKIP_EMAIL_VERIFICATION: "true"
          RESEND_API_KEY: test-key
          FRONTEND_URL: http://localhost:5173
           
           
           
