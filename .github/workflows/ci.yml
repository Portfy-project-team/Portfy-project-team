name: CI Pipeline

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend
        run: |
          cd frontend
          npm install

      - name: Run frontend lint
        run: |
          cd frontend
          npm run lint

      - name: Build frontend
        run: |
          cd frontend
          chmod +x node_modules/.bin/vite
          npm run build 

      - name: Run frontend tests
        run: |
          cd frontend
          npm test -- --run

      - name: Install backend
        run: |
          cd backend
          npm install

      - name: Run backend tests
        run: |
          cd backend
          npm test

      - name: Security audit frontend
        run: |
          cd frontend
          npm audit --audit-level=high

      - name: Security audit backend
        run: |
          cd backend
          npm audit --audit-level=high
     